<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meltdown Protocol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game">
    <h1>Meltdown Protocol</h1>
    <p class="subtitle">Keep the reactor stable.</p>

    <section class="reactor-panel">
      <h2>Reactor Status</h2>

      <div class="stat">
        <span>Temperature</span>
        <strong><span id="temperature">50</span>°C</strong>
      </div>

      <div class="temperature-bar">
        <div id="temperature-fill"></div>
      </div>

      <div class="stat">
        <span>Power generated</span>
        <strong><span id="power">0</span> MW</strong>
      </div>

      <p id="status" class="status">Reactor is stable.</p>
    </section>

    <section class="controls">
      <button id="power-button">Generate Power</button>
      <button id="cool-button">Cool Reactor</button>
      <button id="restart-button" class="hidden">Restart Reactor</button>
    </section>

    <p class="instructions">
      Generate power to earn energy, but watch the temperature. Cool the reactor before it reaches 100°C.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
